<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="description" content="Budget – Ausgaben erfassen und den Monat im Blick behalten.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<title>Budget</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<script>
  try{var t=localStorage.getItem('budget.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
  try{var f=localStorage.getItem('budget.fs');if(f==='l'||f==='xl')document.documentElement.dataset.fs=f}catch(e){}
</script>
</head>
<body>
<nav id="nav" class="nav" aria-label="Hauptnavigation">
  <div class="nav-brand" aria-hidden="true">Budget</div>
  <a href="#/" data-tab="home" class="nav-i">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>
    <span>Übersicht</span>
  </a>
  <button class="nav-add" data-a="add" aria-label="Ausgabe erfassen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span class="nav-add-l">Erfassen</span>
  </button>
  <a href="#/stats" data-tab="stats" class="nav-i">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>
    <span class="l-long">Auswertung</span><span class="l-short">Statistik</span>
  </a>
  <a href="#/settings" data-tab="settings" class="nav-i">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    <span class="l-long">Einstellungen</span><span class="l-short">Einstellen</span>
  </a>
  <a href="#/help" data-tab="help" class="nav-i">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"/><path d="M12 17.2v.1"/></svg>
    <span>Hilfe</span>
  </a>
</nav>

<main id="view" aria-live="polite"></main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-a="closeSheet"></div>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="icon-btn" data-a="closeSheet" aria-label="Schließen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>
<input id="fileBackup" type="file" accept="application/json,.json" hidden>

<script src="app.js"></script>
<script src="help.js"></script>
</body>
</html>
